<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelp Cathedral - WebGPU Underwater</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#03101a; }
  #cv { display:block; width:100vw; height:100vh; }
  #cv.locked { cursor:none; }
  #hud { position:fixed; left:10px; top:9px; font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;
         color:#cdeef6; text-shadow:0 1px 3px rgba(0,0,0,.85); white-space:pre; pointer-events:none; opacity:.9; }
  #ov { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
        gap:6px; background:radial-gradient(ellipse at 50% 38%, rgba(14,86,116,.5), rgba(2,10,20,.9));
        color:#e2f7fb; font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace; text-align:center;
        transition:opacity .45s ease; }

</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div>
<div id="err"></div>
<div id="ov">
  <h1>KELP&nbsp;CATHEDRAL</h1>
  <div><span class="k">WASD</span> swim &nbsp; <span class="k">Q</span>/<span class="k">E</span> down/up &nbsp;
       <span class="k">Shift</span> surge &nbsp; <span class="k">H</span> hud &nbsp; <span class="k">R</span> reset</div>
  <div class="dim">mouse look uses pointer lock - click the water to dive in</div>
  <div class="dim" id="ovgpu">initialising webgpu...</div>
</div>
<script>
'use strict';
// ============================================================
//  Kelp Cathedral - procedural WebGPU underwater scene.
//  No engine, no assets: every mesh, texture-free material and
//  animation is generated here. Zero per-frame JS allocations.
// ============================================================

const Q = new URLSearchParams(location.search);
const qp = (k, d) => (Q.has(k) ? parseFloat(Q.get(k)) : d);

const CFG = {
  // world
  surfaceY: 62.0,
  groundHalf: 240.0,      // ground mesh spans +/- this in x,z
  gridN: 300,             // ground grid subdivisions
  // fjord layout: valley floor near -34, walls that climb past the surface so the
  // world edge is never visible from inside the canyon.
  canyon: { base: -34.0, wall: 52.0, inner: 44.0, outer: 104.0, rim: 96.0 },

  // camera
  fovDeg: 72, near: 0.15, far: 900,
  speed: 13.0, boost: 3.1, damping: 9.0, mouseGain: 0.0022,
  startPos: [-6, -6, 104], startYaw: 0.06, startPitch: -0.04,

  // render
  msaa: qp('msaa', 4), renderScale: qp('scale', 1), dprCap: qp('dpr', 1.5),
  fogCull: qp('fogCull', 215),   // instances beyond this distance are culled
  raySteps: qp('steps', 24), rayReach: qp('reach', 170),
  kelpMax: qp('kelpMax', 6500), kelpNodes: qp('nodes', 13),

  // water / lighting
  absorb: [0.0262, 0.0139, 0.0092],   // per-metre RGB extinction (red dies first)
  shallow: [0.038, 0.262, 0.378],     // in-scatter radiance near the surface
  deep: [0.0035, 0.044, 0.118],       // in-scatter radiance in the deep blue
  sunDir: [0.22, 0.70, -0.68],
  sunColor: [1.00, 0.94, 0.79],
  sunIntensity: 2.10,
  skyAmbient: 0.47,
  exposure: 1.07,
  contrast: 0.42,
  causticStrength: 0.95,
  godrayStrength: 0.86,
  godrayShaft: 0.62,          // shaft-only gain: beams without the veiling
  godrayDecay: 0.955,
  bloomThreshold: 1.55,
  bloomIntensity: 0.64,
  vignette: 0.34,
  density: qp('density', 1),          // instance-count multiplier
  diag: qp('diag', 0),                // 1 = composite shows the NaN map
  time: qp('time', -1),               // >= 0 pins the clock: frames become reproducible,
                                      // which is what tools/diff.js needs to isolate a layer
};
{ // URL overrides for tuning during the critic loop
  const o = { exposure: 'exposure', sunIntensity: 'sun', causticStrength: 'caustic',
              godrayStrength: 'gr', godrayShaft: 'gs', bloomIntensity: 'bloom',
              vignette: 'vig', fovDeg: 'fov' };
  for (const k in o) { if (Q.has(o[k])) CFG[k] = qp(o[k], CFG[k]); }
}
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// ---------------- mat4 (column-major, WebGPU z in [0,1]) ----------------
function m4perspective(o, fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy * 0.5);
  o[0] = f / aspect; o[1] = 0; o[2] = 0; o[3] = 0;
  o[4] = 0; o[5] = f; o[6] = 0; o[7] = 0;
  o[8] = 0; o[9] = 0; o[10] = far / (near - far); o[11] = -1;
  o[12] = 0; o[13] = 0; o[14] = near * far / (near - far); o[15] = 0;
  return o;
}
function m4mul(o, a, b) { // o = a * b
  for (let c = 0; c < 4; c++) {
    const b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
    o[c * 4 + 0] = a[0] * b0 + a[4] * b1 + a[8] * b2 + a[12] * b3;
    o[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9] * b2 + a[13] * b3;
    o[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
    o[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
  }
  return o;
}
// view from eye + yaw/pitch (yaw 0 looks toward -z, +yaw turns right)
function m4view(o, ex, ey, ez, yaw, pitch) {
  const cp = Math.cos(pitch), sp = Math.sin(pitch), cy = Math.cos(yaw), sy = Math.sin(yaw);
  const fx = sy * cp, fy = sp, fz = -cy * cp;   // forward (yaw 0 looks toward -z)
  const rx = cy, ry = 0, rz = sy;               // right
  const ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;
  // right-handed view space: -z is forward, so the third row is -forward
  o[0] = rx; o[1] = ux; o[2] = -fx; o[3] = 0;
  o[4] = ry; o[5] = uy; o[6] = -fy; o[7] = 0;
  o[8] = rz; o[9] = uz; o[10] = -fz; o[11] = 0;
  o[12] = -(rx * ex + ry * ey + rz * ez);
  o[13] = -(ux * ex + uy * ey + uz * ez);
  o[14] = (fx * ex + fy * ey + fz * ez);
  o[15] = 1;
  return o;
}

// ---------------- deterministic PRNG + noise ----------------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function h2i(x, y) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vn2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = h2i(xi, yi), b = h2i(xi + 1, yi), c = h2i(xi, yi + 1), d = h2i(xi + 1, yi + 1);
  return (a + (b - a) * u) * (1 - v) + (c + (d - c) * u) * v;
}
function fbm2(x, y, oct) {
  let s = 0, amp = 0.5, norm = 0, fx = x, fy = y;
  for (let i = 0; i < oct; i++) { s += amp * vn2(fx, fy); norm += amp; fx = fx * 2.03 + 37.1; fy = fy * 1.97 - 21.7; amp *= 0.5; }
  return s / norm;
}

// ---------------- terrain ----------------
// The world is a winding canyon running along +/-z, walled by towering rock,
// with shelves where the set pieces sit. Everything else is placed on top of it.
function canyonCenter(z) {
  return 26 * Math.sin(z * 0.0125) + 13 * Math.sin(z * 0.0041 + 1.9) + 5 * Math.sin(z * 0.021 + 0.7);
}
function bedHeight(x, z) {
  const C = CFG.canyon;
  const d = Math.abs(x - canyonCenter(z));
  let h = C.base + 5.0 * (fbm2(x * 0.011, z * 0.011, 4) - 0.5) * 2.0 + 2.2 * Math.sin(z * 0.026 + x * 0.017);
  // main walls
  const wall = smoothstep(C.inner, C.outer, d);
  h += wall * (C.wall + 26.0 * (fbm2(x * 0.0072 + 11.0, z * 0.0072 - 5.0, 3) - 0.5));
  // rim: rock keeps climbing above the waterline, hiding the edge of the world
  h += smoothstep(C.outer, C.outer + 116, d) * C.rim;
  // terraces on the walls so ledges and overhangs appear
  h += wall * 4.5 * Math.sin(d * 0.13 + z * 0.02);
  // bouldery relief everywhere, sharper ridges on the canyon walls
  h += 2.6 * (fbm2(x * 0.075 + 3.1, z * 0.075 - 1.7, 3) - 0.5) * 2.0;
  h += wall * 9.0 * (fbm2(x * 0.048 - 7.0, z * 0.048 + 2.3, 3) - 0.5) * 2.0;
  // close the valley far away in +/- z so no boundary is ever visible
  h += smoothstep(120, 196, Math.abs(z)) * (92 + 34 * fbm2(x * 0.01 - 3, z * 0.01 + 9, 2));
  // shelves for the two set pieces (sandy pads on the valley floor)
  h = shelf(h, x, z, SET.ship.x, SET.ship.z, SET.ship.r, -25.5);
  h = shelf(h, x, z, SET.fluke.x, SET.fluke.z, SET.fluke.r, -26.5);
  return h;
}
function shelf(h, x, z, sx, sz, r, target) {
  const dx = x - sx, dz = z - sz, dd = Math.sqrt(dx * dx + dz * dz);
  const t = smoothstep(r, r * 0.55, dd);
  return h * (1 - t) + target * t;
}
// surface current used by kelp sway (kept identical in WGSL)
// ---------------- frame-time / gpu timing ----------------
// Percentile helper shared by the frame-time ring buffers.
function pctList(arr, n) {
  const c = Array.prototype.slice.call(arr.subarray(0, n));
  c.sort((a, b) => a - b);
  return c;
}
function tsReport(arr, n) {
  if (!n) return { count: 0 };
  const c = pctList(arr, n);
  const P = p => c[clamp(Math.round(p * (n - 1)), 0, n - 1)];
  const sum = c.reduce((x, y) => x + y, 0);
  return { count: n, avg: +(sum / n).toFixed(3), p50: +P(.5).toFixed(3),
           p99: +P(.99).toFixed(3), max: +c[n - 1].toFixed(3) };
}
class Stats {
  constructor(cap) {
    this.cap = cap; this.n = 0; this.w = 0;
    this.cpu = new Float32Array(cap);   // rAF delta (frame pacing)
    this.gpu = new Float32Array(cap);   // submit -> onSubmittedWorkDone latency
    this.srt = new Float32Array(cap);   // scratch for percentiles
    this.gonly = new Float32Array(cap); // GPU-timestamp samples (real device time)
    this.gw = 0; this.gn = 0;
    this.t0 = 0; this.tPrev = 0;
  }
  reset() { this.n = 0; this.w = 0; this.gw = 0; this.gn = 0; }
  push(cpuMs, gpuMs) {
    const i = this.w; this.w = (this.w + 1) % this.cap; this.n = Math.min(this.n + 1, this.cap);
    this.cpu[i] = cpuMs; this.gpu[i] = gpuMs;
  }
  pushGpu(ms) {
    const i = this.gw % this.cap; this.gw++; this.gn = Math.min(this.gn + 1, this.cap);
    this.gonly[i] = ms;
  }
  static pct(arr, n, p) {
    const s = arr.subarray(0, n); for (let i = 0; i < n; i++) s[i] = arr[i];
    const c = Array.prototype.slice.call(s); c.sort((a, b) => a - b);
    return c[clamp(Math.round(p * (n - 1)), 0, n - 1)];
  }
  report() {
    const n = this.n; if (!n) return { frames: 0 };
    const cpu = Array.prototype.slice.call(this.cpu.subarray(0, n)).sort((a, b) => a - b);
    const gpu = Array.prototype.slice.call(this.gpu.subarray(0, n)).sort((a, b) => a - b);
    const P = (c, p) => c[clamp(Math.round(p * (n - 1)), 0, n - 1)];
    const sum = a => a.reduce((x, y) => x + y, 0);
    return {
      frames: n,
      ms: { avg: +(sum(cpu) / n).toFixed(2), p50: +P(cpu, .5).toFixed(2), p90: +P(cpu, .9).toFixed(2),
            p99: +P(cpu, .99).toFixed(2), p999: +P(cpu, .999).toFixed(2), max: +cpu[n - 1].toFixed(2) },
      fps: { avg: +(1000 / (sum(cpu) / n)).toFixed(1), p1low: +(1000 / P(cpu, .99)).toFixed(1),
             p01low: +(1000 / cpu[n - 1]).toFixed(1) },
      gpuMs: { avg: +(sum(gpu) / n).toFixed(2), p50: +P(gpu, .5).toFixed(2),
               p99: +P(gpu, .99).toFixed(2), p999: +P(gpu, .999).toFixed(2), max: +gpu[n - 1].toFixed(2) },
      tsMs: tsReport(this.gonly, this.gn),
    };
  }
}
// ============================ WGSL: scene ============================
const WGSL_COMMON = `
struct U {
  viewProj : mat4x4<f32>,
  view     : mat4x4<f32>,
  camPos   : vec4<f32>,   // xyz + time
  camBasis : vec4<f32>,   // yaw, pitch, surfaceY, tan(fov/2)
  sunDir   : vec4<f32>,   // xyz (toward the sun) + intensity
  sunColor : vec4<f32>,
  absorb   : vec4<f32>,   // per-metre extinction rgb
  shallow  : vec4<f32>,   // in-scatter radiance near the surface
  deep     : vec4<f32>,   // in-scatter radiance in the deep
  params0  : vec4<f32>,   // exposure, causticStrength, skyAmbient, fogCull
  params1  : vec4<f32>,   // near, far, godrayStrength, godrayDecay
  params2  : vec4<f32>,   // bloomThreshold, bloomIntensity, vignette, contrast
  screen   : vec4<f32>,   // width, height, 1/w, 1/h
  params3  : vec4<f32>,   // 1/rayW, 1/rayH, ray steps, ray reach
  params4  : vec4<f32>,   // diagnostics (1 = show NaN map), shaft gain, spare, spare
};
@group(0) @binding(0) var<uniform> u : U;

const TAU : f32 = 6.2831853;

fn fract21(p : vec2<f32>) -> vec2<f32> { return p - floor(p); }
fn h11(p : f32) -> f32 {
  let q = fract(p * 0.1031);
  let q3 = q * (q + 33.33) * (q + q);
  return fract(q3 * q3);
}
fn h31(p : vec3<f32>) -> f32 {
  let q = fract(p * vec3(0.1031, 0.1030, 0.0973));
  return fract(((p.x + q.y) * (p.y + q.z)) * p.z) ;
}
fn h21(p : vec2<f32>) -> f32 {
  var q = fract21(p * vec2(0.1031, 0.1030));
  q += dot(q, q + 33.33);
  return fract((q.x + q.y) * q.x);
}
fn h33(p : vec3<f32>) -> vec3<f32> {
  var q = fract(p * vec3(0.1031, 0.1030, 0.0973));
  q += dot(q, q.yzx + 33.33);
  return fract((q.xxx + q.yzy) * q.zxy);
}
// smooth value noise
fn vn3(p : vec3<f32>) -> f32 {
  let i = floor(p); let f = p - i;
  let v = f * f * (3.0 - 2.0 * f);
  let a = h31(i + vec3(0,0,0)); let b = h31(i + vec3(1,0,0));
  let c = h31(i + vec3(0,1,0)); let d = h31(i + vec3(1,1,0));
  let e = h31(i + vec3(0,0,1)); let ff = h31(i + vec3(1,0,1));
  let g = h31(i + vec3(0,1,1)); let h = h31(i + vec3(1,1,1));
  let x0 = mix(mix(a, b, v.x), mix(c, d, v.x), v.y);
  let x1 = mix(mix(e, ff, v.x), mix(g, h, v.x), v.y);
  return mix(x0, x1, v.z);
}
fn vn2(p : vec2<f32>) -> f32 {
  let i = floor(p); let f = fract21(p);
  let v = f * f * (3.0 - 2.0 * f);
  let a = h21(i + vec2(0,0)); let b = h21(i + vec2(1,0));
  let c = h21(i + vec2(0,1)); let d = h21(i + vec2(1,1));
  return mix(mix(a, b, v.x), mix(c, d, v.x), v.y);
}
fn fbm3(p : vec3<f32>, oct : i32) -> f32 {
  var s = 0.0; var a = 0.5; var n = 0.0; var q = p;
  for (var i = 0; i < oct; i++) { s += a * vn3(q); n += a; q = q * 2.03 + vec3(31.7, -11.3, 19.1); a *= 0.5; }
  return s / n;
}
fn fbm2(p : vec2<f32>, oct : i32) -> f32 {
  var s = 0.0; var a = 0.5; var n = 0.0; var q = p;
  for (var i = 0; i < oct; i++) { s += a * vn2(q); n += a; q = q * 2.07 + vec2(17.35, -7.17); a *= 0.5; }
  return s / n;
}
fn sstep(a : f32, b : f32, x : f32) -> f32 {
  let t = clamp((x - a) / (b - a), 0.0, 1.0);
  return t * t * (3.0 - 2.0 * t);
}
// Fresnel-style cube. Using pow() here is a trap: interpolated normals make the dot
// product creep a hair past 1, and pow() of a negative base is undefined in WGSL - on
// AMD it returns NaN, which the tonemapper then stamps as a hard black square.
fn cube(x : f32) -> f32 { return x * x * x; }
// ---- water ----
fn waterTint(depthBelow : f32) -> vec3<f32> {
  // cyan near the surface, true blue in the depths: a slightly biased ramp keeps the
  // near field colourful while the far field darkens fast enough to read as depth.
  let k = clamp(depthBelow / 74.0, 0.0, 1.0);
  return mix(u.shallow.rgb, u.deep.rgb, k * k * 0.55 + 0.45 * k);
}
// ---- colour grading helpers ----
// Narkowicz ACES approximation. Its raw shoulder sits at 2.51/4.43 = 0.567, so the
// curve is renormalised: without that, sunlight could never reach display white and
// the whole frame would be trapped in the lower three quarters of sRGB (flat, milky).
fn aces(x : vec3<f32>) -> vec3<f32> {
  let a = x * (2.51 * x + 0.03);
  let b = x * (4.43 * x + 0.59) + 0.14;
  return clamp(a / b * 1.7647, vec3<f32>(0.0), vec3<f32>(1.0));
}
// in-scattered radiance along a ray: this is what distant geometry fades into,
// so the open-water background uses exactly the same expression.
fn waterInscat(midPos : vec3<f32>, dir : vec3<f32>, shaft : f32) -> vec3<f32> {
  let depth = max(u.camBasis.z - midPos.y, 0.0);
  let tint = waterTint(depth);
  let sd = max(dot(dir, u.sunDir.xyz), 0.0);
  // Wider, weaker forward lobe: the haze has to stay under the tonemapper's shoulder,
  // otherwise the whole upper half clips to white and the depth gradient disappears.
  // The sun itself is handed to the ray pass, which blooms instead of veiling.
  let ph = 0.07 + 0.24 * pow(sd, 4.0) + 0.52 * pow(sd, 34.0);
  // sunlight only reaches the upper part of the water column, so the haze towards the
  // floor is blue-black: that is what gives the canyon its depth.
  let sunReach = 0.22 + 0.78 * exp(-depth * 0.022);
  return tint * (u.params0.z * 0.46) + u.sunColor.rgb * (u.sunDir.w * 0.062 * ph * sunReach) * (1.0 + shaft * 1.6);
}
// Beer-Lambert absorption + integrated in-scatter. The haze is deliberately darker
// than sunlit rock near the camera so distance reads as cyan -> deep blue.
// Every material passes through here, so this is also where a poisoned pixel is caught:
// WGSL leaves pow() of a negative base (interpolated normals can push a dot product
// past 1) undefined, and one NaN face entering the bloom chain smears out as a hard-edged
// black card. Falling back to the local haze is invisible.
fn fogBlend(col : vec3<f32>, dist : f32, midPos : vec3<f32>, dir : vec3<f32>, shaft : f32) -> vec3<f32> {
  let T = exp(-u.absorb.xyz * dist);
  let ins = waterInscat(midPos, dir, shaft);
  let ok = all(col >= vec3<f32>(0.0)) && all(col <= vec3<f32>(1.0e4));
  return select(ins, col, ok) * T + ins * (vec3<f32>(1.0) - T);
}
// distance-based amount of caustic light (weak far away, and weak deep down)
fn causticVisibility(worldY : f32, dist : f32) -> f32 {
  let depth = clamp((u.camBasis.z - worldY) / 90.0, 0.0, 1.0);
  return (1.0 - depth * 0.75) * exp(-dist * 0.011);
}
// classic sum-of-cosines caustic network, animated by the current
fn caustics(p : vec2<f32>, t : f32) -> f32 {
  let uv = p * 1.35;
  var q = fract21(uv / TAU) * TAU - 250.0;
  var i = q;
  var c = 1.0;
  let inten = 0.0055;
  for (var n = 0; n < 4; n++) {
    let ft = t * (1.0 - (3.0 / f32(n + 1)));
    let sx = sin(i.x + ft); let sy = cos(i.y + ft);
    i = q + vec2(cos(ft - i.x) + sin(ft + i.y), sin(ft - i.y) + cos(ft + i.x));
    c += 1.0 / max(length(vec2(q.x / (sx / inten + 0.0001), q.y / (sy / inten + 0.0001))), 0.05);
  }
  c = c / 4.0;
  c = 1.16 - pow(c, 7.0);
  return clamp(c, 0.0, 1.0);
}

`;

// ---- seabed: procedural sand / rock / magenta ground cover ----
const WGSL_BED = WGSL_COMMON + `
fn bedNoise(p : vec3<f32>) -> f32 {
  return fbm3(p * vec3<f32>(0.09, 0.11, 0.09), 3);
}
@vertex fn bedVS(@location(0) pos : vec3<f32>, @location(1) nrm : vec3<f32>) -> VSOut {
  var o : VSOut;
  o.pos = u.viewProj * vec4<f32>(pos, 1.0);
  o.wpos = vec4<f32>(pos, 0.0);
  o.nrm = nrm;
  o.uv = pos.xz * 0.02;
  o.aux = vec4<f32>(0.0);
  return o;
}
@fragment fn bedFS(in : VSOut) -> @location(0) vec4<f32> {
  let wp = in.wpos.xyz;
  let dist = length(wp - u.camPos.xyz);
  let dir = (wp - u.camPos.xyz) / max(dist, 0.001);

  // fine surface relief: perturb the geometric normal with two extra taps
  let nz = bedNoise(wp);
  let ex = bedNoise(wp + vec3<f32>(1.0 / 0.09 * 0.35, 0.0, 0.0));
  let ez = bedNoise(wp + vec3<f32>(0.0, 0.0, 1.0 / 0.09 * 0.35));
  let detail = vec3<f32>((ex - nz), 0.0, (ez - nz)) * 3.2;
  let n = normalize(in.nrm + detail - vec3<f32>(0.0, detail.y, 0.0));

  let slope = 1.0 - clamp(n.y, 0.0, 1.0);
  // sand in the flat valley, craggy rock on the walls
  let grain = fbm3(wp * vec3<f32>(0.55, 0.7, 0.55), 2);
  let strata = 0.5 + 0.5 * sin(wp.y * 0.55 + fbm3(wp * 0.06, 2) * 6.0);
  var rock = mix(vec3<f32>(0.058, 0.082, 0.108), vec3<f32>(0.150, 0.185, 0.200), grain);
  rock = mix(rock, vec3<f32>(0.215, 0.235, 0.230), strata * 0.30 * sstep(0.15, 0.9, slope));
  let sand = mix(vec3<f32>(0.150, 0.225, 0.228), vec3<f32>(0.300, 0.355, 0.338), grain);
  var alb = mix(sand, rock, sstep(0.16, 0.52, slope));

  // beds with a finer tongue pattern on the edge, otherwise the boundary reads as a
  // set of soft pink islands dropped on the sand.
  var gc = sstep(0.40, 0.60, fbm2(wp.xz * 0.028, 2) * 0.65 + fbm2(wp.xz * 0.085 + 4.0, 2) * 0.35);
  gc *= 1.0 - sstep(0.28, 0.55, slope);

  // pasted over the blue scene. Drier colour, less coverage, and it leans toward the
  // water colour the deeper it lies, so floor and haze keep one palette.
  let gcWarm = mix(vec3<f32>(0.118, 0.046, 0.100), vec3<f32>(0.292, 0.132, 0.216), gcHue);
  let gcCool = mix(gcWarm, vec3<f32>(0.086, 0.114, 0.168),
                   0.50 * clamp((u.camBasis.z - wp.y) / 96.0, 0.0, 1.0));

  // so the high-frequency term cannot alias into a shimmering checkerboard
  alb *= 0.92 + 0.16 * mix(h31(floor(wp * 1.30)), fbm3(wp * vec3<f32>(1.30, 1.55, 1.30), 2),

  let sd = max(dot(n, u.sunDir.xyz), 0.0);
  let wsd = pow(clamp(dot(n, u.sunDir.xyz) * 0.5 + 0.5, 0.0, 1.0), 1.5);
  let skyUp = 0.5 + 0.5 * n.y;

            + waterTint(max(u.camBasis.z - wp.y, 0.0)) * u.params0.z * (1.30 + 0.85 * skyUp)
            + vec3<f32>(0.058, 0.028, 0.044) * u.params0.z * gc;   // cover bounce
  // caustics on upward faces
  let ca = caustics(wp.xz + vec2<f32>(1.0, 0.4) * u.camPos.w * 0.35, u.camPos.w * 0.55);
  light += vec3<f32>(0.42, 0.92, 0.95) * ca * u.params0.y * 0.45 * (max(n.y, 0.0) * causticVisibility(wp.y, dist));
  // fake contact shading in creases
  light *= 0.62 + 0.5 * nz;

}
`;

// ---- water surface seen from below (waves, Snell window, glitter, sun) ----
const WGSL_SURF = WGSL_COMMON + `
fn waveH(p : vec2<f32>, t : f32) -> f32 {
  let a = p * 0.021 + vec2<f32>(0.055, -0.031) * t;
  let b = p * 0.062 + vec2<f32>(-0.09, 0.07) * t;
  let c = p * 0.155 + vec2<f32>(0.13, 0.11) * t;
  return (fbm2(a, 2) - 0.5) * 5.0 + (vn2(b) - 0.5) * 1.7 + (vn2(c) - 0.5) * 0.55;
}
// cheaper height used for the per-pixel normal (one octave less)
fn waveQ(p : vec2<f32>, t : f32) -> f32 {
  let a = p * 0.021 + vec2<f32>(0.055, -0.031) * t;
  let b = p * 0.062 + vec2<f32>(-0.09, 0.07) * t;
  return (fbm2(a, 2) - 0.5) * 5.0 + (vn2(b) - 0.5) * 1.7;
}
fn waveNQ(p : vec2<f32>, t : f32, e : f32) -> vec3<f32> {
  let h0 = waveQ(p, t);
  let hx = waveQ(p + vec2<f32>(e, 0.0), t) - h0;
  let hz = waveQ(p + vec2<f32>(0.0, e), t) - h0;
  return normalize(vec3<f32>(-hx / e, 1.0, -hz / e));
}

  let up = clamp(dir.y, 0.0, 1.0);

  var c = mix(vec3<f32>(0.62, 0.93, 0.99), vec3<f32>(0.05, 0.33, 0.50), pow(1.0 - up, 0.75));
  // soft cloud banks projected onto the sky dome: the ceiling gets structure instead
  // of reading as a flat disc
  let cl = fbm2(dir.xz / max(dir.y, 0.22) * 0.55 + vec2<f32>(0.5, -0.35) * u.camPos.w * 0.013, 2);
  c *= 0.80 + 0.42 * cl;
  c = mix(c, vec3<f32>(1.35, 1.25, 0.96), pow(sd, 6.0) * 0.80);
  c += u.sunColor.rgb * 5.5 * pow(sd, 150.0);
  return c;
}
@vertex fn surfVS(@location(0) pos : vec3<f32>) -> VSOut {
  var o : VSOut;
  let t = u.camPos.w;
  // the disc rides with the camera, so its dense rings always sit overhead instead of
  // at whatever distance the world origin happens to be
  var p = vec3<f32>(pos.x + u.camPos.x, 0.0, pos.z + u.camPos.z);
  p.y = u.camBasis.z + waveH(p.xz, t);

  o.wpos = vec4<f32>(p, 0.0);

  o.aux = vec4<f32>(0.0);
  return o;
}
@fragment fn surfFS(in : VSOut) -> @location(0) vec4<f32> {
  let wp = in.wpos.xyz;
  let dist = length(wp - u.camPos.xyz);
  let V = normalize(u.camPos.xyz - wp);      // surface -> camera
  let t = u.camPos.w;
  // Per-pixel wave normal. The patch is coarse far away, so widen the finite
  // difference with distance: distant facets average out instead of shimmering.
  let Nb = -waveNQ(wp.xz, t, 0.65 + dist * 0.030);
  let eta = 1.333;                           // water to air: gives the 48.6 deg Snell window
  let r = refract(-V, Nb, eta);

  let toSun = max(dot(-V, u.sunDir.xyz), 0.0);

  // below the tonemapper's shoulder so the ceiling keeps its structure instead of
  // turning into one white sheet.
  var sky = skyRad(r) * vec3<f32>(0.88, 0.99, 1.04) * 1.40;
  let sdR = max(dot(r, u.sunDir.xyz), 0.0);

  // total internal reflection: the underside mirrors the water and the distant kelp
  let rr = reflect(-V, Nb);

  // of light instead of a hard silhouette line

`;

// ---- kelp: instanced stalks of twisted ribbons, cantilever sway, gold/green specks ----
const WGSL_KELP = WGSL_COMMON + `
@vertex fn kelpVS(
  @location(0) lp : vec3<f32>, @location(1) ln : vec3<f32>, @location(2) luv : vec2<f32>,

  var o : VSOut;

  let ph = i1.y;

  let tw = lv * i2.z + i1.w * 6.2831 + t * 0.07;
  let cs = cos(tw); let sn = sin(tw);
  let lx = lp.x * i1.x; let lz = lp.z * i1.x;

  let disp = lv * lv;

  let sz = cos(t * 0.47 + ph * 1.3 - lv * 0.9) * 0.66 + sin(t * 0.21 + ph) * 0.34;

  wp.z += disp * (sz * 0.085 + i2.y * 0.10) * h;

  if (d > u.params0.w) { o.pos = vec4<f32>(0.0, 0.0, 2.0, 1.0); return o; }

  o.wpos = vec4<f32>(wp, 0.0);
  o.nrm = normalize(vec3<f32>(ln.x * cs - ln.z * sn, ln.y, ln.x * sn + ln.z * cs));

@fragment fn kelpFS(in : VSOut) -> @location(0) vec4<f32> {
  let wp = in.wpos.xyz;

  let dir = (wp - u.camPos.xyz) / max(dist, 0.001);
  let tint = in.aux.x; let seed = in.aux.y;
  let v = in.uv.y;
  let n = normalize(in.nrm);

  // green -> gold; the grain term is only resolved close up, cheap hash beyond, and
  // the two cross-fade so no ring sweeps through the forest as the camera moves
  var grain = h31(floor(wp * 1.6) + vec3<f32>(seed * 11.0));
  if (dist < 66.0) { grain = mix(grain, fbm3(wp * vec3<f32>(1.35, 0.48, 1.35), 3), sstep(66.0, 38.0, dist)); }

  // sides. And the canopy above is gold-olive while the understory stays deep green,
  // because light really does fall off like that through 60 m of water.

  // used a saturated magenta, which became the loudest object in an otherwise cold frame

  // colour) and the variant fades into ordinary green with distance, so a frond 50 m away
  // does not out-shout its neighbours.

  let spark = mix(vec3<f32>(0.72, 1.00, 0.52), vec3<f32>(1.00, 0.82, 0.30), fract(seed * 7.0));
  col += spark * sp * 1.9 * sstep(95.0, 14.0, dist) * (0.20 + 1.00 * (front + back));

`;

  let seed = in.aux.x; let scale = in.aux.w;
  let kind = in.uv.x; let tint = in.uv.y;
  var nd = normalize(in.nrm);

  let n = nd;

  var grain = h31(floor(wp * 1.3) + vec3<f32>(seed * 7.0));
  // cross-fade into the smooth fbm rather than swapping it on at a fixed distance,
  // which would show up as a ring travelling across the rock as the camera moves
  if (dist < 58.0) { grain = mix(grain, fbm3(wp * vec3<f32>(0.52, 0.66, 0.52), 3), sstep(58.0, 30.0, dist)); }

    alb = mix(vec3<f32>(0.145, 0.062, 0.052), vec3<f32>(0.395, 0.205, 0.105), tint * 0.65 + 0.35 * grain);
    alb *= 0.86 + 0.22 * rib;

    let poly = fbm3(wp * vec3<f32>(2.6, 2.6, 2.6), 2);
    alb = pal(tint * 0.55 + poly * 0.30 + 0.62,
              vec3<f32>(0.32, 0.10, 0.30), vec3<f32>(0.34, 0.12, 0.26),
              vec3<f32>(1.00, 0.90, 0.85), vec3<f32>(0.10, 0.32, 0.62));
    alb *= 0.72 + 0.52 * poly;
  } else if (kind > 4.5 && kind < 5.5) {
    // barnacled ship timber: grey-brown planks with pale growth. Kept well above the
    // rock albedos - a dark hull at 30 m in this haze reads as a shapeless shadow.

    alb = mix(vec3<f32>(0.150, 0.122, 0.098), vec3<f32>(0.345, 0.290, 0.225), grain);

  // fades out with distance, otherwise the hash aliases into a grey checkerboard on
  // the far canyon walls
  // Timber is the one kind the critic looks at from 33 m, so its grain has to survive
  // further out than rock does; the aliasing this buys is the same kind of sparkle that
  // weathered oak actually has, and it costs nothing on the canyon walls.
  var detR = 40.0;
  if (kind > 4.5 && kind < 5.5) { detR = 72.0; }
  alb *= mix(1.0, 0.88 + 0.24 * h31(floor(wp * 4.6) + vec3<f32>(seed * 17.0)), sstep(detR, 10.0, dist));
  // magenta encrusting cover: patchy growth that favours quiet upward faces, but with
  // a 3D boundary so it never paints a clean "pink cap" across the top of a boulder
  let cov = sstep(0.46, 0.72, fbm2(wp.xz * 0.24 + wp.y * 0.16 + seed * 3.0, 2)) * up * up;
  alb = mix(alb, vec3<f32>(0.215, 0.090, 0.170), cov * 0.50);
  // green film in the crevices
  alb = mix(alb, vec3<f32>(0.11, 0.22, 0.10), sstep(0.35, 0.05, grain) * 0.30);

  let sd = max(dot(n, u.sunDir.xyz), 0.0);
  // Wrapped sun term: a face a little away from the sun still catches scattered light,
  // so boulders keep their form instead of turning into black cut-outs when backlit.
  let wsd = pow(clamp(dot(n, u.sunDir.xyz) * 0.5 + 0.5, 0.0, 1.0), 1.5);
  let skyUp = 0.5 + 0.5 * n.y;
  // Rock sits inside a bright blue light dome: sun overhead, glowing water all round
  // and a magenta bounce off the cover.
  var light = u.sunColor.rgb * u.sunDir.w * (sd * 0.42 + wsd * 0.34)
            + waterTint(max(u.camBasis.z - wp.y, 0.0)) * u.params0.z * (1.45 + 0.80 * skyUp)
            + vec3<f32>(0.070, 0.034, 0.056) * u.params0.z * (1.0 - skyUp);

    let ca = caustics(wp.xz + vec2<f32>(1.0, 0.4) * u.camPos.w * 0.35, u.camPos.w * 0.55);
    light += vec3<f32>(0.42, 0.92, 0.95) * ca * u.params0.y * 0.42 * up * causticVisibility(wp.y, dist);

  var col = alb * light * (0.80 + 0.34 * grain);
  // Iridescent sheen: coral wears it at full strength, carved stone only a whisper -
  // on a flat plinth face a full band reads as a painted rainbow edge.
  var sheen = 0.0;
  if (kind > 3.5 && kind < 4.5) { sheen = 0.30; }
  if (kind > 5.5) { sheen = 0.10; }
  if (sheen > 0.0) {
    let fres = cube(max(1.0 - max(dot(n, -dir), 0.0), 0.0));
    col += pal(fres * 0.8 + tint + u.camPos.w * 0.02,
               vec3<f32>(0.30, 0.16, 0.36), vec3<f32>(0.30, 0.20, 0.24),
               vec3<f32>(1.0, 1.0, 1.0), vec3<f32>(0.30, 0.55, 0.75)) * fres * sheen;
  }
  return vec4<f32>(fogBlend(col, dist, mix(u.camPos.xyz, wp, 0.5), dir, 0.0), 1.0);
}
`;

// ---------------- frame loop ----------------
let RUNNING = false, rafId = 0, lastNow = 0, hudLast = 0, gpuLast = 0;
function stepFrame(cpuMs) {
  // ?time=<sec> pins the clock: dt becomes 0, so the camera, the sway, the caustics and
  // the snow all stand still and two screenshots of the same setup are pixel-identical.
  const dt = CFG.time >= 0 ? 0 : Math.min(0.05, cpuMs * 0.001);
  R.time = CFG.time >= 0 ? CFG.time : R.time + dt;
  R.frame++;
  if (tour.on) tour.t += dt;
  updateCamera(dt);
  writeUniforms();
}
function hudTick(now) {
  if (!hudOn || now - hudLast < 200) return;
  hudLast = now;
  const r = stats.report();
  hudEl.textContent =
    (r.frames ? (r.fps.avg.toFixed(0) + ' fps  ' + r.ms.avg.toFixed(2) + ' ms  p99 ' + r.ms.p99.toFixed(1) +
                 '  gpu ' + ((r.tsMs && r.tsMs.avg) || r.gpuMs.avg || 0).toFixed(2)) : '-') +
    '\n' + cam.x.toFixed(1) + ', ' + cam.y.toFixed(1) + ', ' + cam.z.toFixed(1) +
    (tour.on ? '  TOUR ' + ((tour.t / tour.dur) % 1 * 100).toFixed(0) + '%' : (locked ? '  locked' : '')) +
    '\nmsaa x' + R.samples + '  ' + R.w + 'x' + R.h + '  t ' + R.time.toFixed(0) + 's';
}
function liveTick(now) {
  rafId = requestAnimationFrame(liveTick);
  const cpu = now - lastNow; lastNow = now;
  if (cpu <= 0 || cpu > 500) { stats.push(16.7, 0); return; }
  stepFrame(cpu);
  const slot = renderAll(TS.ok && (R.frame % TS.every) === 0);
  if (slot) tsRead(slot);
  if (LUMA_REQ) { const q = LUMA_REQ; LUMA_REQ = null; q(sampleLuma()); }
  stats.push(cpu, 0);
  hudTick(now);
}
// Brightness probe for the verification tooling: sampled inside the frame, because a
// WebGPU canvas reads back as blank between frames. The 2D scratch canvas is created
// on first use and reused, so probing adds no per-frame garbage either.
let LUMA_REQ = null, lumaCv = null, lumaCtx = null;
function sampleLuma() {
  if (!lumaCv) {
    lumaCv = document.createElement('canvas');
    lumaCv.width = 160; lumaCv.height = 90;
    lumaCtx = lumaCv.getContext('2d', { willReadFrequently: true });
  }
  lumaCtx.drawImage(canvas, 0, 0, 160, 90);
  const d = lumaCtx.getImageData(0, 0, 160, 90).data;
  let s = 0, sr = 0, sg = 0, sb = 0, cl = 0, c16 = 0, c84 = 0, mx = 0;
  const n = d.length / 4;
  for (let i = 0; i < d.length; i += 4) {
    const l = (d[i] * 0.2126 + d[i + 1] * 0.7152 + d[i + 2] * 0.0722) / 255;
    s += l; sr += d[i] / 255; sg += d[i + 1] / 255; sb += d[i + 2] / 255;
    if (l > mx) mx = l;
    if (l < 0.055) c16++; else if (l < 0.28) c84++; else cl++;
  }
  return [+(s / n).toFixed(3), +mx.toFixed(3), +(sr / n).toFixed(3), +(sg / n).toFixed(3),
          +(sb / n).toFixed(3), +(c16 / n).toFixed(3), +(c84 / n).toFixed(3), +(cl / n).toFixed(3)];
}
sampleLuma.h = new Float32Array(64);
// Contact sheet for the visual review: each requested pose is blitted from the live
// canvas into a grid on an offscreen 2D canvas, then handed back as one data URL.
let SHEET = null, SHEET_REQ = null;
function sheetBlit() {
  const c = SHEET.ctx, i = SHEET.i % SHEET.cols, r = (SHEET.i / SHEET.cols) | 0;
  c.drawImage(canvas, i * SHEET.cw, r * SHEET.ch, SHEET.cw, SHEET.ch);
  c.strokeStyle = 'rgba(255,255,255,0.35)';
  c.strokeRect(i * SHEET.cw + 0.5, r * SHEET.ch + 0.5, SHEET.cw - 1, SHEET.ch - 1);
  c.fillStyle = '#fff'; c.font = '20px monospace';
  c.fillText(SHEET.label + ' ' + (SHEET.names[SHEET.i] || ''), i * SHEET.cw + 8, r * SHEET.ch + 24);
  SHEET.i++;
}
const nextRAF = () => new Promise(res => requestAnimationFrame(res));
async function syncLoop() {
  while (RUNNING) {
    const now = await nextRAF();
    const cpu = now - lastNow; lastNow = now;
    if (cpu <= 0 || cpu > 500) continue;
    stepFrame(cpu);
    if (PERF.mode === 'profile') { gpuLast = await renderProfile(); stats.push(cpu, gpuLast); }
    else {
      const t0 = performance.now();
      const slot = renderAll(TS.ok);
      if (slot) tsRead(slot);
      await R.device.queue.onSubmittedWorkDone();
      gpuLast = performance.now() - t0;
      stats.push(cpu, gpuLast);
    }
    hudTick(now);
  }
}

// ---------------- external control / verification API ----------------
const API = {
  get ready() { return R.ready; },
  poses: POSES.map(p => p.name),
  errors: ERRORS,
  info: CFG,
  setPose(i) {
    const p = POSES[((i % POSES.length) + POSES.length) % POSES.length];
    tour.on = false;
    cam.x = p.x; cam.z = p.z;
    cam.y = Math.max(p.y, bedHeight(p.x, p.z) + 14.0);
    cam.yaw = p.yaw; cam.pitch = p.pitch;
    cam.vx = cam.vy = cam.vz = 0;
    hideOverlay();
    return p.name;
  },
  startTour(sec) {
    tour.on = true; tour.t = 0; tour.dur = Math.max(4, sec || 30);
    stats.reset(); PERF.acc = Object.create(null); PERF.cnt = Object.create(null);
    hideOverlay();
    return tour.dur;
  },
  stopTour() { tour.on = false; return true; },
  get tourProgress() { return tour.on ? (tour.t / tour.dur) % 1 : -1; },
  resetStats() { stats.reset(); PERF.acc = Object.create(null); PERF.cnt = Object.create(null); },
  getStats() {
    const r = stats.report();
    r.mode = PERF.mode; r.frame = R.frame; r.time = +R.time.toFixed(1);
    r.size = [R.w, R.h]; r.msaa = R.samples;
    r.errors = ERRORS.slice(0, 8);
    const pm = Object.create(null);
    for (const k in PERF.acc) pm[k] = +(PERF.acc[k] / Math.max(1, PERF.cnt[k])).toFixed(3);
    r.passMs = pm;
    r.cam = [+cam.x.toFixed(1), +cam.y.toFixed(1), +cam.z.toFixed(1),
             +cam.yaw.toFixed(3), +cam.pitch.toFixed(3)];
    return r;
  },
  set(k, v) { if (k in CFG) { CFG[k] = v; return CFG[k]; } return null; },
  hud(on) { hudOn = !!on; hudEl.style.display = hudOn ? '' : 'none'; return hudOn; },
  hideOverlay: hideOverlay,
  hide(s) {   // debug: limit which layers draw, e.g. __scene.hide('kelp,props')
    HIDE.clear();
    for (const k of String(s || '').split(',').filter(Boolean)) HIDE.add(k);
    return Array.from(HIDE).join(' ');
  },
  resetCam: resetCam,
  frameLog() {   // raw rAF deltas of the measured window, for the perf log file
    const n = stats.n, out = new Array(n);
    for (let i = 0; i < n; i++) out[i] = +stats.cpu[i].toFixed(2);
    return out;
  },
  gpuLog() {
    const n = stats.n, out = new Array(n);
    for (let i = 0; i < n; i++) out[i] = +stats.gpu[i].toFixed(2);
    return out;
  },
  tsInfo() { return { ok: TS.ok, why: TS.why, passLevel: !!TS.passLevel }; },
  luma() { return new Promise(res => { LUMA_REQ = res; }); },   // sampled inside the next frame
  cam: cam, bed: bedHeight, surfaceY: CFG.surfaceY,
  POSES: POSES, stats: stats,
};
window.__scene = API;

// ---------------- boot ----------------
async function boot() {
  if (!navigator.gpu) { ovGpu.textContent = 'WebGPU is not available in this browser'; pushErr('no navigator.gpu'); return; }
  R.adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!R.adapter) { ovGpu.textContent = 'no WebGPU adapter'; pushErr('no adapter'); return; }
  const req = [];
  if (R.adapter.features.has('timestamp-query')) req.push('timestamp-query');
  // Builds that only allow timestamps inside a render pass advertise this extra feature.
  for (const f of ['chromium-experimental-timestamp-query-inside-passes'])
    if (R.adapter.features.has(f)) req.push(f);
  R.device = await R.adapter.requestDevice({ requiredFeatures: req });
  R.device.onuncapturederror = e => pushErr('GPU: ' + e.error.message.split('\n')[0]);
  R.ctx = canvas.getContext('webgpu');
  R.canvasFormat = navigator.gpu.getPreferredCanvasFormat();
  R.ctx.configure({ device: R.device, format: R.canvasFormat, alphaMode: 'opaque',
                    usage: GPUTextureUsage.RENDER_ATTACHMENT,
                    preserveDrawingBuffer: Q.has('dbg') });
  R.sampler = R.device.createSampler({ magFilter: 'linear', minFilter: 'linear', addressMode: 'clamp-to-edge' });
  R.ubo = R.device.createBuffer({ size: F.byteLength, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  initLayouts();
  buildWorld();
  BG.global = R.device.createBindGroup({
    layout: LAYOUT.sceneBGL,
    entries: [{ binding: 0, resource: { buffer: R.ubo } }],
  });
  buildPasses();
  tsInit();
  R.rebuildTargets = rebuildTargets;
  resize();
  window.addEventListener('resize', () => resize());
  if (Q.has('pose')) API.setPose(parseInt(Q.get('pose'), 10) || 0);
  if (Q.has('tour')) API.startTour(qp('tour', 30));
  R.ready = true;
  ovGpu.textContent = 'webgpu ok - ' + R.canvasFormat + ' - msaa x' + R.samples;
  RUNNING = true; lastNow = performance.now();
  if (PERF.mode === 'live') rafId = requestAnimationFrame(liveTick); else syncLoop();
}
boot();
</script>
</body>
</html>
